spring:
  application:
    name: pro-skill

  # 导入本地开发数据库配置（文件存在则加载，不存在则跳过）
  # 开发者需在 src/main/resources/ 中创建 application-local.properties 并填写本机 DB 信息，该文件已被 .gitignore 忽略
  config:
    import: optional:classpath:application-local.properties

  # 数据源。本机运行时由 application-local.properties 覆盖 URL。
  # 容器里不要用 localhost：那是容器自己。Compose 用环境变量 APP_LESSON_DATASOURCE_HOST=mysql。
  datasource:
    url: jdbc:mysql://${app.lesson.datasource-host}:3306/${db.name}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# ===== 服务端口 =====
server:
  port: 8080

# ===== MyBatis =====
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ===== 日志 =====
# traceId 为空时括号里是空白，用来对照「看不出哪一次请求」。
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{40} - %msg%n"
  level:
    root: INFO
    com.eurasia.pro_skill: DEBUG
    org.mybatis: DEBUG

# ===== 课堂开关 =====
# trace-id：off 不写入请求号；on 写入 MDC 和响应头 X-Trace-Id。
# outbound-check：off 剩余不够也照减；on 不够就返回 INSUFFICIENT_STOCK。
# optimistic-lock：off 更新只按 id；on 带上读到的 version，对不上返回 STOCK_CONFLICT。
# order-state：open 已完成的单还能改行；enforced 不是草稿就返回 ORDER_NOT_EDITABLE。
# flow-after-commit：off 入库流水另开事务先提交；on 和入库状态同一次提交。
# inbound-fail-before-status：true 时入库在改状态前失败，演示事务边界用。
# outbound-read-pause-ms：出库读到数量后停多少毫秒。演示两次请求同时读到旧数时设成 3000。
# datasource-host：本机进程用 localhost；容器里必须是 Compose 服务名 mysql。
db:
  name: pro_skill
  username: root
  password: root

app:
  lesson:
    trace-id: off
    outbound-check: off
    optimistic-lock: off
    order-state: open
    flow-after-commit: off
    inbound-fail-before-status: false
    outbound-read-pause-ms: 0
    datasource-host: localhost
  jwt:
    # 256-bit Base64 编码的 HMAC-SHA256 签名密钥（生产环境请通过环境变量覆盖）
    secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24=
    # token 有效期（毫秒），默认 24 小时
    expiration: 86400000

# ===== Swagger / OpenAPI =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized
