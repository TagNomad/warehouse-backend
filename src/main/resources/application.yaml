spring:
  application:
    name: pro-skill

  # 导入本地开发数据库配置（文件存在则加载，不存在则跳过）
  # 开发者需在 src/main/resources/ 中创建 application-local.properties 并填写本机 DB 信息，该文件已被 .gitignore 忽略
  config:
    import: optional:classpath:application-local.properties

  # 数据源。本机运行时由 application-local.properties 覆盖 URL。
  # 容器里不要用 localhost：那是容器自己。Compose 用环境变量 APP_LESSON_DATASOURCE_HOST=mysql。
  datasource:
    url: jdbc:mysql://${app.lesson.datasource-host}:3306/${db.name}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # 在分支之间切换时，库里可能已有更高版本。打开后，没执行过的低版本脚本也会补上
    out-of-order: true

# ===== 服务端口 =====
server:
  port: 8080

# ===== MyBatis =====
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ===== 日志 =====
# traceId 为空时括号里是空白，用来对照「看不出哪一次请求」。
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{40} - %msg%n"
  level:
    root: INFO
    com.eurasia.pro_skill: DEBUG
    org.mybatis: DEBUG

# ===== 课堂开关 =====
# trace-id：off 不写入请求号；on 写入 MDC 和响应头 X-Trace-Id。
# optimistic-lock：off 更新只按 id；on 带上读到的 version，对不上返回 STOCK_CONFLICT。
# inbound-fail-before-status：true 时入库在改状态前失败，演示事务边界用。
# outbound-read-pause-ms：出库读到数量后停多少毫秒。演示两次请求同时读到旧数时设成 3000。
# cache-evict：off 出库、入库改了数量也不动缓存；on 提交之后删掉这个格子的缓存键 inv:货品:库位。
# stock-lock：after-check 判断完才加锁、写完马上放；sku-location 读之前加锁，事务结束才放。
# submit-once：off 加行时不看 Idempotency-Key；on 同一个键只加一行。
# publish-after-commit：off 入库事务还没结束就 XADD；on 提交之后才 XADD。
# consume-once：off 重投的消息再写一行通知；on 用消息编号去重。
# consume-fail-before-ack：true 时消费者写完通知、XACK 之前失败一次，演示消息重投用。
# notice-poll-ms：消费者多久读一次 Stream。
# datasource-host：本机进程用 localhost；容器里必须是 Compose 服务名 mysql。
db:
  name: pro_skill
  username: root
  password: root

app:
  lesson:
    trace-id: off
    optimistic-lock: on
    inbound-fail-before-status: false
    outbound-read-pause-ms: 0
    cache-evict: on
    stock-lock: sku-location
    submit-once: on
    publish-after-commit: on
    consume-once: on
    consume-fail-before-ack: false
    notice-poll-ms: 1000
    file-store: local
    inventory-query: full
    metrics: off
    redis-host: localhost
    redis-port: 6379
    datasource-host: localhost
  jwt:
    # 256-bit Base64 编码的 HMAC-SHA256 签名密钥（生产环境请通过环境变量覆盖）
    secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24=
    # token 有效期（毫秒），默认 24 小时
    expiration: 86400000

# ===== Swagger / OpenAPI =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized
