spring:
  application:
    name: pro-skill

  # 导入本地开发数据库配置（文件存在则加载，不存在则跳过）
  # 开发者需在 src/main/resources/ 中创建 application.default.yml 并填写本机 DB 信息，该文件已被 .gitignore 忽略
  config:
    import: optional:classpath:application.default.yml

  # 数据源（具体连接信息写在 application.default.yml 中）
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

# ===== 服务端口 =====
server:
  port: 8080

# ===== MyBatis =====
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ===== 日志 =====
logging:
  level:
    root: INFO
    com.eurasia.pro_skill: DEBUG
    org.mybatis: DEBUG

# ===== Swagger / OpenAPI =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ===== JWT =====
app:
  jwt:
    # 256-bit Base64 编码的 HMAC-SHA256 签名密钥（生产环境请通过环境变量覆盖）
    secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24=
    # token 有效期（毫秒），默认 24 小时
    expiration: 86400000

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized
