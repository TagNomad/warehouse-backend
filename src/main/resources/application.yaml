spring:
  application:
    name: pro-skill

  # 本机 MySQL 的账号密码不是 root / root 时，在同一个文件夹建 application-local.properties 覆盖，
  # 写法见 application-local.properties.example。没有这个文件就跳过。
  config:
    import: optional:classpath:application-local.properties

  # 数据源：连本机 3306 上的 pro_skill 库。库不存在时自动建（createDatabaseIfNotExist），表由下面的 Flyway 建。
  datasource:
    url: jdbc:mysql://${app.lesson.datasource-host}:3306/${db.name}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # 在分支之间切换时，库里可能已有更高版本。打开后，没执行过的低版本脚本也会补上
    out-of-order: true

# ===== 服务端口 =====
server:
  port: 8080

# ===== MyBatis =====
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ===== 日志 =====
# traceId 为空时括号里是空白，用来对照「看不出哪一次请求」。
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{40} - %msg%n"
  level:
    root: INFO
    com.eurasia.pro_skill: DEBUG
    org.mybatis: DEBUG

# ===== 课堂开关 =====
# trace-id：off 不写入请求号；on 写入 MDC 和响应头 X-Trace-Id。
# datasource-host：本机进程用 localhost；容器里必须是 Compose 服务名 mysql。
db:
  name: pro_skill
  username: root
  password: root

app:
  lesson:
    trace-id: off
    datasource-host: localhost
  jwt:
    # 256-bit Base64 编码的 HMAC-SHA256 签名密钥（生产环境请通过环境变量覆盖）
    secret: bXlTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24=
    # token 有效期（毫秒），默认 24 小时
    expiration: 86400000

# ===== Swagger / OpenAPI =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized
