# 第一部分基座：MySQL + Adminer + 应用。
#   docker compose -f docker-compose.dev.yml up -d --build
#
# 应用容器连服务名 mysql。要复现「容器里写 localhost」：
#   docker compose -f docker-compose.dev.yml -f docker-compose.localhost.yml up -d --force-recreate app
#
# 打开 TraceId：
#   APP_LESSON_TRACE_ID=on docker compose -f docker-compose.dev.yml up -d --force-recreate app
#
# 浏览器和 curl 仍访问 http://localhost:8080（映射到容器端口）。
# Adminer：http://localhost:8081

services:
  mysql:
    image: mysql:8
    container_name: pro-skill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pro_skill
    ports:
      - "3306:3306"
    volumes:
      - pro-skill-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer:4
    container_name: pro-skill-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

  minio:
    # 官方 minio/minio 镜像已不再公开提供，这里用社区维护的 MinIO 构建，命令和控制台与官方相同
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: pro-skill-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # 应用读写对象走这个端口
      - "9001:9001" # 网页控制台，浏览器打开 http://localhost:9001
    volumes:
      - pro-skill-minio-data:/data # 对象放在数据卷里，MinIO 容器重建也还在

  redis:
    image: redis:7
    container_name: pro-skill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    image: pro-skill-app
    container_name: pro-skill-app
    restart: unless-stopped
    environment:
      APP_LESSON_DATASOURCE_HOST: ${APP_LESSON_DATASOURCE_HOST:-mysql}
      APP_LESSON_TRACE_ID: ${APP_LESSON_TRACE_ID:-off}
      APP_LESSON_OUTBOUND_CHECK: ${APP_LESSON_OUTBOUND_CHECK:-on}
      APP_LESSON_OPTIMISTIC_LOCK: ${APP_LESSON_OPTIMISTIC_LOCK:-on}
      APP_LESSON_ORDER_STATE: ${APP_LESSON_ORDER_STATE:-enforced}
      APP_LESSON_FLOW_AFTER_COMMIT: ${APP_LESSON_FLOW_AFTER_COMMIT:-on}
      APP_LESSON_INBOUND_FAIL_BEFORE_STATUS: ${APP_LESSON_INBOUND_FAIL_BEFORE_STATUS:-false}
      APP_LESSON_OUTBOUND_READ_PAUSE_MS: ${APP_LESSON_OUTBOUND_READ_PAUSE_MS:-0}
      APP_LESSON_REDIS_HOST: ${APP_LESSON_REDIS_HOST:-redis}
      APP_LESSON_CACHE_EVICT: ${APP_LESSON_CACHE_EVICT:-on}
      APP_LESSON_STOCK_LOCK: ${APP_LESSON_STOCK_LOCK:-sku-location}
      APP_LESSON_SUBMIT_ONCE: ${APP_LESSON_SUBMIT_ONCE:-on}
      APP_LESSON_PUBLISH_AFTER_COMMIT: ${APP_LESSON_PUBLISH_AFTER_COMMIT:-on}
      APP_LESSON_CONSUME_ONCE: ${APP_LESSON_CONSUME_ONCE:-on}
      APP_LESSON_CONSUME_FAIL_BEFORE_ACK: ${APP_LESSON_CONSUME_FAIL_BEFORE_ACK:-false}
      APP_LESSON_FILE_STORE: ${APP_LESSON_FILE_STORE:-local}
      APP_LESSON_FILE_KEY: ${APP_LESSON_FILE_KEY:-filename}
      APP_LESSON_MINIO_ENDPOINT: ${APP_LESSON_MINIO_ENDPOINT:-http://minio:9000}
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s

volumes:
  pro-skill-mysql-data:
  pro-skill-minio-data:
